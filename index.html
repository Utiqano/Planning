        function initCalendar() {

        function shouldShowOnDay(item, fullDate) {
            if (item.statut === 'planifier') {
                return true;
            } else {
                const dateStr = item.statut === 'realiser' ? item.dateRealisation : item.statut === 'raporter' ? item.dateRapporter : item.dateNonRealisation;
                if (!dateStr) return false;
                const itemDate = new Date(dateStr);
                return itemDate.getFullYear() === fullDate.getFullYear() &&
                       itemDate.getMonth() === fullDate.getMonth() &&
                       itemDate.getDate() === fullDate.getDate();
            }
        }

        // ✅ FIX CLIC MOIS - createMonthCalendar() with large option
        function createMonthCalendar(year, month, monthName, monthIndex, isLarge = false) {
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay() || 7;
            
            const containerClass = isLarge ? 'large-month-container' : 'month-container';
            const gridClass = isLarge ? 'large-calendar-grid calendar-grid' : 'calendar-grid';
            
            let gridHtml = `<div class="${gridClass}">`;
            ['L', 'M', 'M', 'J', 'V', 'S', 'D'].forEach(day => {
                gridHtml += `<div class="day-header">${day}</div>`;
            });
            
            for (let i = 1; i < firstDay; i++) {
                gridHtml += '<div class="day-cell"></div>';
            }
            
            for (let day = 1; day <= daysInMonth; day++) {
                const fullDate = new Date(year, month, day);
                const weekNum = getWeekNumber(fullDate);
                const weekPlannings = getMonthPlannings(month, weekNum);
                const dayPlannings = weekPlannings.filter(item => shouldShowOnDay(item, fullDate));
                
                let planningHtml = '';
                dayPlannings.forEach(item => {
                    const dateStr = item.statut === 'realiser' && item.dateRealisation 
                        ? `Réalisé: ${new Date(item.dateRealisation).toLocaleDateString('fr-FR')}`
                        : item.statut === 'raporter' && item.dateRapporter 
                        ? `Reporté: ${new Date(item.dateRapporter).toLocaleDateString('fr-FR')}`
                        : item.statut === 'non_realiser' && item.dateNonRealisation 
                        ? `Non Réalisé: ${new Date(item.dateNonRealisation).toLocaleDateString('fr-FR')}`
                        : '';
                    const technicienStr = item.statut === 'realiser' && item.technicien 
                        ? `Technicien: ${item.technicien}`
                        : '';
                    const ligneDisplay = item.ligne === 'Imprimer Preventive Niveau 2' ? `<a href="https://wkwgroup-my.sharepoint.com/:f:/r/personal/houssine_trabelsi_wkw-group_com/Documents/pr%C3%A9ventive%20niveau%202?csf=1&web=1&e=Mvv1UP" target="_blank">${item.ligne}</a>` : item.ligne;
                    planningHtml += `
                        <div class="planning-item ${item.statut}">
                            <div class="planning-left">
                                <div class="planning-line">${getEmoji(item.statut)} ${ligneDisplay}</div>
                                <div class="planning-details">${item.heures}H | ${item.effectif}EF</div>
                                ${dateStr ? `<div class="planning-date">${dateStr}</div>` : ''}
                                ${technicienStr ? `<div class="planning-date">${technicienStr}</div>` : ''}
                            </div>
                            <div class="planning-actions">
                                <button class="action-btn" onclick="window.editPlanning('${item.id}')"><i class="fas fa-edit"></i></button>
                                <button class="action-btn" onclick="window.deletePlanning('${item.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>`;
                });
                
                gridHtml += `
                    <div class="day-cell" onclick="window.openAddFormForWeek(${weekNum})">
                        <div class="week-number" onclick="event.stopPropagation(); window.openAddFormForWeek(${weekNum})">S${weekNum.toString().padStart(2, '0')}</div>
                        <div class="day-number">${day}</div>
                        ${planningHtml}
                    </div>
                `;
            }
            
            const totalCells = 42;
            const filledCells = firstDay - 1 + daysInMonth;
            for (let i = filledCells; i < totalCells; i++) {
                gridHtml += '<div class="day-cell"></div>';
            }
            gridHtml += '</div>';
            
            return `
                <div class="${containerClass}">
                    <div class="month-header" data-month="${monthIndex}">
                        <h3 class="month-title">${monthName} 2025</h3>
                    </div>
                    ${gridHtml}
                </div>
            `;
        }

        // ANALYTIQUES

                        legend: { display: false },

                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: 'Valeur', font: { size: 12 } } }
                    }
                }
            });

            if (realisationChart) realisationChart.destroy();
            realisationChart = new Chart(document.getElementById('realisationChart'), {
                type: 'doughnut',

                    labels: ['Réalisé', 'Non Réalisé'],

                    }]

                        legend: { position: 'bottom', labels: { font: { size: 12 } } },

                    }

        // VUE HEBDOMADAIRE
        function showWeek(weekNum) {
            currentWeek = weekNum;
            const container = document.getElementById('weekContainer');
            const weekStart = getWeekStartDate(2025, weekNum);
            const weekDays = [];
            for (let i = 0; i < 7; i++) {
                const date = new Date(weekStart);
                date.setDate(weekStart.getDate() + i);
                weekDays.push(date);
            }

            let html = `
                <div class="week-container">
                    <div class="week-header">
                        <div class="week-nav">
                            <button class="week-nav-btn" onclick="window.showWeek(${Math.max(1, weekNum-1)})"><i class="fas fa-chevron-left"></i></button>
                            <div class="week-select-group">
                                <label>Semaine:</label>
                                <select class="week-select" onchange="window.showWeek(parseInt(this.value))">
                                    ${Array.from({length: 52}, (_, i) => `<option value="${i+1}" ${i+1 === weekNum ? 'selected' : ''}>S${(i+1).toString().padStart(2, '0')}</option>`).join('')}
                                </select>
                            </div>
                            <div class="week-title">Semaine ${weekNum.toString().padStart(2, '0')} 2025</div>
                            <button class="week-nav-btn" onclick="window.showWeek(${Math.min(52, weekNum+1)})"><i class="fas fa-chevron-right"></i></button>
                        </div>
                        <button onclick="window.toggleWeekFullScreen()"><i class="fas fa-expand"></i> Plein Écran pour TV</button>
                    </div>
                    <div class="week-grid">
            `;

            ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].forEach(day => {
                html += `<div class="week-day-header">${day}</div>`;
            });

            const weekPlannings = getWeekPlannings(weekNum);
            weekDays.forEach(date => {
                const dayPlannings = weekPlannings.filter(item => shouldShowOnDay(item, date));
                let planningHtml = '';
                dayPlannings.forEach(item => {
                    const dateStr = item.statut === 'realiser' && item.dateRealisation 
                        ? `Réalisé: ${new Date(item.dateRealisation).toLocaleDateString('fr-FR')}`
                        : item.statut === 'raporter' && item.dateRapporter 
                        ? `Reporté: ${new Date(item.dateRapporter).toLocaleDateString('fr-FR')}`
                        : item.statut === 'non_realiser' && item.dateNonRealisation 
                        ? `Non Réalisé: ${new Date(item.dateNonRealisation).toLocaleDateString('fr-FR')}`
                        : '';
                    const technicienStr = item.statut === 'realiser' && item.technicien 
                        ? `Technicien: ${item.technicien}`
                        : '';
                    const ligneDisplay = item.ligne === 'Imprimer Preventive Niveau 2' ? `<a href="https://wkwgroup-my.sharepoint.com/:f:/r/personal/houssine_trabelsi_wkw-group_com/Documents/pr%C3%A9ventive%20niveau%202?csf=1&web=1&e=Mvv1UP" target="_blank">${item.ligne}</a>` : item.ligne;
                    planningHtml += `
                        <div class="planning-item ${item.statut}">
                            <div class="planning-left">
                                <div class="planning-line">${getEmoji(item.statut)} ${ligneDisplay}</div>
                                <div class="planning-details">${item.heures}H | ${item.effectif}EF</div>
                                ${dateStr ? `<div class="planning-date">${dateStr}</div>` : ''}
                                ${technicienStr ? `<div class="planning-date">${technicienStr}</div>` : ''}
                            </div>
                            <div class="planning-actions">
                                <button class="action-btn" onclick="window.editPlanning('${item.id}')"><i class="fas fa-edit"></i></button>
                                <button class="action-btn" onclick="window.deletePlanning('${item.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                });

                html += `
                    <div class="week-day-cell" onclick="window.openAddFormForWeek(${weekNum})">
                        <div class="week-date">${date.getDate()}/${date.getMonth()+1}</div>
                        <div class="week-plannings">${planningHtml || '<div style="color:#6c757d; font-style:italic;">Aucun planning</div>'}</div>
                    </div>
                `;
            });

            html += `</div>${createWeekSummary(weekNum)}</div>`;
            container.innerHTML = html;
            updateAnalytics('week');
        }

        function getWeekPlannings(weekNum) {
            return Object.values(planningData).flat().filter(item => item.semaine === weekNum);
        }

        function createWeekSummary(weekNum) {
            const weekPlannings = getWeekPlannings(weekNum);
            return `
                <div class="month-summary">
                    <h4>Résumé Semaine ${weekNum.toString().padStart(2, '0')}</h4>
                    <table class="summary-table">
                        <thead><tr><th>Sem</th><th>Mois</th><th>Heures</th><th>Effectif</th><th>Ligne</th><th>Statut</th><th>Date</th><th>Technicien</th></tr></thead>
                        <tbody>
                            ${weekPlannings.map(item => {
                                const dateStr = item.dateRealisation || item.dateRapporter || item.dateNonRealisation || '-';
                                const dateFormatted = dateStr !== '-' ? new Date(dateStr).toLocaleDateString('fr-FR') : '-';
                                const ligneDisplay = item.ligne === 'Imprimer Preventive Niveau 2' ? `<a href="https://wkwgroup-my.sharepoint.com/:f:/r/personal/houssine_trabelsi_wkw-group_com/Documents/pr%C3%A9ventive%20niveau%202?csf=1&web=1&e=Mvv1UP" target="_blank">${item.ligne}</a>` : item.ligne;
                                return `
                                <tr class="${item.statut}">
                                    <td>S${item.semaine.toString().padStart(2, '0')}</td><td>${monthNames[item.month]}</td><td>${item.heures}</td>
                                    <td>${item.effectif}</td><td>${ligneDisplay}</td>
                                    <td>${getEmoji(item.statut)}</td>
                                    <td>${dateFormatted}</td>
                                    <td>${item.technicien ? item.technicien : '-'}</td>
                                </tr>
                            `}).join('')}
                            ${weekPlannings.length === 0 ? '<tr><td colspan="8" style="color:#6c757d;">Aucun planning</td></tr>' : ''}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function getMonthPlannings(month, week) { return planningData[`${month}_${week}`] || []; }
        function getMonthSummary(month) { return Object.values(planningData).flat().filter(item => item.month === month); }
        function getEmoji(statut) { return {planifier: '📋', realiser: '✅', raporter: '🔴', non_realiser: '❌'}[statut] || ''; }
        function getMonthName(index) { return monthNames[index] || 'Inconnu'; }
        function getWeekNumber(date) {
            const startDate = new Date(date.getFullYear(), 0, 1);
            const days = Math.floor((date - startDate) / (24 * 60 * 60 * 1000));
            return Math.ceil((days + startDate.getDay() + 1) / 7);
        }
        function getMonthFromWeek(week) {
            const monthMap = [[1,5],[6,9],[10,13],[14,17],[18,22],[23,26],[27,30],[31,35],[36,39],[40,43],[44,47],[48,52]];
            for (let i = 0; i < monthMap.length; i++) {
                if (week >= monthMap[i][0] && week <= monthMap[i][1]) return i;
            }
            return 0;
        }
        function getWeekStartDate(year, week) {
            const jan1 = new Date(year, 0, 1);
            const daysToAdd = (week - 1) * 7;
            const weekStart = new Date(jan1);
            weekStart.setDate(jan1.getDate() + daysToAdd);
            const dayOfWeek = weekStart.getDay();
            weekStart.setDate(weekStart.getDate() - dayOfWeek + 1);
            return weekStart;
        }

        // EXPORT
        document.getElementById('exportBtn').addEventListener('click', () => {
            const allPlannings = Object.values(planningData).flat();
            const excelData = [['Semaine', 'Mois', 'Heures', 'Effectif', 'Ligne', 'Statut', 'Date', 'Technicien', 'Date Création']];
            
            allPlannings.forEach(item => {
                const dateStr = item.dateRealisation || item.dateRapporter || item.dateNonRealisation || '-';
                const dateFormatted = dateStr !== '-' ? new Date(dateStr).toLocaleDateString('fr-FR') : '-';
                excelData.push([
                    `S${item.semaine.toString().padStart(2, '0')}`, monthNames[item.month], item.heures, item.effectif,
                    item.ligne, item.statut,
                    dateFormatted,
                    item.technicien ? item.technicien : '-',
                    new Date(item.createdAt).toLocaleDateString('fr-FR')
                ]);
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(excelData);
            XLSX.utils.book_append_sheet(wb, ws, 'Planning 2025');
            XLSX.writeFile(wb, `TV-DASH_Analytique_2025_${new Date().toISOString().split('T')[0]}.xlsx`);
            alert('✅ ANALYTIQUE EXCEL EXPORTÉ !');
        });
    </script>
